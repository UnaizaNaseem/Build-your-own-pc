.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;z-index:10;padding:5vh 4%}.modal.open{display:block}.modalbox{max-width:1000px;height:90vh;margin:auto;background:#0e1218;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.modalhead{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:12px}.search{flex:1;background:#090c11;border:1px solid var(--line);color:white;padding:13px 15px;border-radius:11px;outline:none}.close{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}.filters{display:flex;gap:8px;overflow:auto;padding:12px 20px;border-bottom:1px solid var(--line)}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:20px;cursor:pointer}.chip.active{border-color:var(--blue);color:white;background:rgba(61,123,255,.12)}.list{padding:18px 20px;overflow:auto;display:grid;gap:9px}.choice{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);padding:9px;border-radius:12px;cursor:pointer}.choice:hover{border-color:rgba(61,123,255,.55)}.choice img{width:58px;height:58px;object-fit:contain;background:#090c11;border-radius:8px}.empty{color:var(--muted);padding:30px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.summary{position:static}.product{grid-template-columns:58px 1fr}.product img{width:58px;height:58px}.product .btn{grid-column:2}.summary{order:-1}}
</style>

const categories = ["motherboard","graphics_card","ram","case","cooling","power_supply","fan"];
const labels={motherboard:"Motherboard",graphics_card:"Graphics Card",ram:"RAM",case:"Case",cooling:"CPU Cooling",power_supply:"Power Supply",fan:"Case Fans"};
let build={}; let currentType=""; let brand="All";

const money=n=>new Intl.NumberFormat("en-PK",{maximumFractionDigits:0}).format(Number(n)||0);
const productsBy=t=>PRODUCTS.filter(p=>(p.Compatibility?.type||"").toLowerCase()===t);
const image=p=>p.Image||"";
const safePrice=p=>Number(p.Price)||0;

function render(){
 document.getElementById("builder").innerHTML=categories.map((t,i)=>{
   const p=build[t];
   return `<div class="step"><div class="stephead"><div class="stepname">${i+1}. ${labels[t]}</div><div class="selected">${p? "Selected":"Not selected"}</div></div>
   ${p?`<div class="product"><img src="${image(p)}" onerror="this.style.display='none'"><div><div class="pname">${p["Product Name"]}</div><div class="meta">${p.Brand||""}</div><div class="price">PKR ${money(safePrice(p))}</div></div><button class="btn" onclick="openModal('${t}')">Change</button></div>`
      :`<button class="btn" onclick="openModal('${t}')">Choose ${labels[t]}</button>`}</div>`
 }).join("");
 updateSummary();
}

function updateSummary(){
 let total=Object.values(build).reduce((s,p)=>s+safePrice(p),0);
 document.getElementById("total").textContent="PKR "+money(total);
 const c=checks(); 
 document.getElementById("compat").innerHTML=c.map(x=>`<div class="compat ${x.level}"><span class="dot"></span><div><b>${x.title}</b><br>${x.text}</div></div>`).join("");
 const bad=c.some(x=>x.level==="bad"), warn=c.some(x=>x.level==="warn");
 const st=document.getElementById("status");
 st.className="status "+(bad?"bad":warn?"warn":"ok");
 st.textContent=bad?"Compatibility issue found":warn?"Build passes, but some details are unavailable":"Build passes basic checks";
}

function checks(){
 const out=[]; const m=build.motherboard,r=build.ram,g=build.graphics_card,c=build.case,cool=build.cooling,psu=build.power_supply;
 if(m&&r){
   const mt=(m.Compatibility?.memory_type||"").toUpperCase(), rt=(r.Compatibility?.memory_type||"").toUpperCase();
   const inferred=(r.Compatibility?.speed||"").toUpperCase().includes("DDR5")?"DDR5":(r.Compatibility?.speed||"").toUpperCase().includes("DDR4")?"DDR4":"";
   const ramType=rt||inferred;
   if(mt&&ramType) out.push({title:"Motherboard ↔ RAM",level:mt===ramType?"ok":"bad",text:mt===ramType?`Motherboard uses ${mt} and RAM is ${ramType}.`:`Motherboard uses ${mt}, but RAM is ${ramType}.`});
   else out.push({title:"Motherboard ↔ RAM",level:"warn",text:"Memory type information is unavailable."});
 }
 if(m&&c){
   const mf=(m.Compatibility?.form_factor||"").toLowerCase(), cf=(c.Compatibility?.form_factor||"").toLowerCase();
   if(mf&&cf) out.push({title:"Motherboard ↔ Case",level:(cf.includes(mf)||mf.includes(cf))?"ok":"bad",text:`Motherboard: ${mf}; case support: ${cf}.`});
   else out.push({title:"Motherboard ↔ Case",level:"warn",text:"Case or motherboard form-factor details are unavailable."});
 }
 if(g&&psu){
   const watts=Number(psu.Compatibility?.wattage), rec=Number(g.Compatibility?.recommended_psu_wattage);
   if(watts&&rec) out.push({title:"Graphics Card ↔ Power Supply",level:watts>=rec?"ok":"bad",text:`PSU provides ${watts}W; GPU recommends ${rec}W.`});
   else out.push({title:"Graphics Card ↔ Power Supply",level:"warn",text:"PSU wattage or GPU recommendation is unavailable."});
 }
 if(m&&cool){
   const sockets=(cool.Compatibility?.supported_sockets||cool.Compatibility?.socket_support||[]);
   const ms=m.Compatibility?.socket;
   if(ms&&sockets.length) out.push({title:"Motherboard ↔ Cooling",level:sockets.includes(ms)?"ok":"bad",text:sockets.includes(ms)?`Cooler supports ${ms}.`:`Cooler does not list support for ${ms}.`});
   else out.push({title:"Motherboard ↔ Cooling",level:"warn",text:"CPU socket support information is unavailable."});
 }
 if(g&&c){
   const gl=Number(g.Compatibility?.length_mm), cc=Number(c.Compatibility?.gpu_clearance_mm);
   if(gl&&cc) out.push({title:"Graphics Card ↔ Case",level:gl<=cc?"ok":"bad",text:gl<=cc?`GPU is ${gl}mm; case clearance is ${cc}mm.`:`GPU is ${gl}mm but case clearance is ${cc}mm.`});
   else out.push({title:"Graphics Card ↔ Case",level:"warn",text:"GPU length or case clearance is unavailable."});
 }
 if(build.fan&&c){
   const fs=Number(build.fan.Compatibility?.size_mm), cs=c.Compatibility?.fan_support;
   if(fs&&cs) out.push({title:"Fan ↔ Case",level:"ok",text:`Fan size: ${fs}mm; case fan support is available.`});
   else out.push({title:"Fan ↔ Case",level:"warn",text:"Fan/case size information could not be verified."});
 }
 return out;
}

function openModal(t){
 currentType=t; brand="All"; document.getElementById("modal").classList.add("open"); document.getElementById("search").value="";
 const brands=["All",...new Set(productsBy(t).map(p=>p.Brand).filter(Boolean))];
 document.getElementById("filters").innerHTML=brands.map(b=>`<button class="chip ${b===brand?"active":""}" onclick="setBrand('${String(b).replaceAll("'","&#39;")}')">${b}</button>`).join("");
 renderList();
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function setBrand(b){brand=b;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent===b));renderList()}
function renderList(){
 const q=document.getElementById("search").value.toLowerCase();
 let arr=productsBy(currentType).filter(p=>(brand==="All"||p.Brand===brand)&&(p["Product Name"]||"").toLowerCase().includes(q));
 document.getElementById("list").innerHTML=arr.map((p,i)=>`<div class="choice" onclick="selectProduct('${p["Product ID"]}')"><img src="${image(p)}" onerror="this.style.display='none'"><div><div class="pname">${p["Product Name"]}</div><div class="meta">${p.Brand||""} · ${p.Category||""}</div></div><strong>PKR ${money(safePrice(p))}</strong></div>`).join("")||`<div class="empty">No products found.</div>`;
}
function selectProduct(id){const p=PRODUCTS.find(x=>String(x["Product ID"])===String(id));if(p){build[currentType]=p;closeModal();render()}}
document.getElementById("search").addEventListener("input",renderList);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
