<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GB Tech — Build Your Own PC</title>
<style>
:root{--bg:#080a0e;--panel:#11151b;--panel2:#151a21;--line:rgba(255,255,255,.08);--blue:#3d7bff;--gold:#d6b35c;--text:#f4f6fa;--muted:#8d96a5;--danger:#ff647c;--ok:#55d68b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,rgba(61,123,255,.10),transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{width:min(1400px,94%);margin:auto}.top{padding:42px 0 28px;border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:700}.title{font-size:clamp(30px,4vw,54px);margin:10px 0 7px;letter-spacing:-.04em}.subtitle{color:var(--muted);max-width:720px}
.layout{display:grid;grid-template-columns:1fr 380px;gap:24px;padding:26px 0 60px}.builder,.summary,.catalog{background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:20px}.builder{padding:20px}.summary{padding:22px;height:max-content;position:sticky;top:20px}.step{padding:20px 4px;border-bottom:1px solid var(--line)}.step:last-child{border:0}.stephead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stepname{font-weight:750;font-size:17px}.selected{font-size:12px;color:var(--blue)}.product{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:14px}.product img{width:70px;height:70px;object-fit:contain;background:#0b0e13;border-radius:10px}.pname{font-weight:650;font-size:14px;line-height:1.35}.meta{font-size:12px;color:var(--muted);margin-top:5px}.price{font-weight:800;margin-top:7px}.btn{border:1px solid rgba(61,123,255,.45);background:rgba(61,123,255,.12);color:#dce7ff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{background:rgba(61,123,255,.2)}.summary h2{margin:0 0 18px}.total{font-size:30px;font-weight:850;margin:6px 0 22px}.compat{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}.ok .dot{background:var(--ok)}.bad .dot{background:var(--danger)}.warn .dot{background:var(--gold)}.status{padding:14px;border-radius:13px;margin-top:18px;font-weight:750}.status.ok{background:rgba(85,214,139,.08);color:var(--ok)}.status.bad{background:rgba(255,100,124,.08);color:var(--danger)}.status.warn{background:rgba(214,179,92,.08);color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;z-index:10;padding:5vh 4%}.modal.open{display:block}.modalbox{max-width:1000px;height:90vh;margin:auto;background:#0e1218;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.modalhead{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:12px}.search{flex:1;background:#090c11;border:1px solid var(--line);color:white;padding:13px 15px;border-radius:11px;outline:none}.close{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}.filters{display:flex;gap:8px;overflow:auto;padding:12px 20px;border-bottom:1px solid var(--line)}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:20px;cursor:pointer}.chip.active{border-color:var(--blue);color:white;background:rgba(61,123,255,.12)}.list{padding:18px 20px;overflow:auto;display:grid;gap:9px}.choice{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);padding:9px;border-radius:12px;cursor:pointer}.choice:hover{border-color:rgba(61,123,255,.55)}.choice img{width:58px;height:58px;object-fit:contain;background:#090c11;border-radius:8px}.empty{color:var(--muted);padding:30px;text-align:center}.product-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:900px){.layout{grid-template-columns:1fr}.summary{position:static}.product{grid-template-columns:58px 1fr}.product img{width:58px;height:58px}.product .btn{grid-column:2}.summary{order:-1}}
</style>
</head>
<body>
<header class="top"><div class="container"><div class="brand">GB TECH</div><h1 class="title">Build Your Own PC</h1><div class="subtitle">Choose your components and check the build as you go. Prices, images and product links come directly from your GB Tech product data.</div></div></header>
<main class="container layout">
<section class="builder" id="builder"></section>
<aside class="summary"><h2>Your Build</h2><div class="total" id="total">PKR 0</div><div id="compat"></div><div id="status"></div></aside>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><input id="search" class="search" placeholder="Search products..."><button class="close" onclick="closeModal()">×</button></div><div class="filters" id="filters"></div><div class="list" id="list"></div></div></div>
<script>
const PRODUCTS = [];
async function loadProducts(){
  try{
    const response=await fetch("./pc_components_normalized.json", {cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();

    if(!Array.isArray(data)){
      throw new Error("pc_components_normalized.json must contain an array of products.");
    }

    PRODUCTS.push(...data);
    render();
  }catch(error){
    console.error("Could not load product data:", error);
    document.getElementById("builder").innerHTML =
      '<div class="empty">Could not load product data. Make sure <b>pc_components_normalized.json</b> is in the same folder as index.html.</div>';
  }
}

 = ["motherboard","graphics_card","ram","case","cooling","power_supply","fan"];
const labels={motherboard:"Motherboard",graphics_card:"Graphics Card",ram:"RAM",case:"Case",cooling:"CPU Cooling",power_supply:"Power Supply",fan:"Case Fans"};
let build={}; let currentType=""; let brand="All";

const money=n=>new Intl.NumberFormat("en-PK",{maximumFractionDigits:0}).format(Number(n)||0);
const productsBy=t=>PRODUCTS.filter(p=>(p.Compatibility?.type||"").toLowerCase()===t);
const image=p=>p.Image||"";
const safePrice=p=>Number(p.Price)||0;

function render(){
 document.getElementById("builder").innerHTML=categories.map((t,i)=>{
   const p=build[t];
   return `<div class="step"><div class="stephead"><div class="stepname">${i+1}. ${labels[t]}</div><div class="selected">${p? "Selected":"Not selected"}</div></div>
   ${p?`<div class="product"><img src="${image(p)}" onerror="this.style.display='none'"><div><div class="pname">${p["Product Name"]}</div><div class="meta">${p.Brand||""}</div><div class="price">PKR ${money(safePrice(p))}</div></div><div class="product-actions"><button class="btn" onclick="openModal('${t}')">Change</button>${p["Product URL"]?`<a class="btn" href="${p["Product URL"]}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View Product</a>`:""}</div></div>`
      :`<button class="btn" onclick="openModal('${t}')">Choose ${labels[t]}</button>`}</div>`
 }).join("");
 updateSummary();
}

function updateSummary(){
 let total=Object.values(build).reduce((s,p)=>s+safePrice(p),0);
 document.getElementById("total").textContent="PKR "+money(total);
 const c=checks(); 
 document.getElementById("compat").innerHTML=c.map(x=>`<div class="compat ${x.level}"><span class="dot"></span><div><b>${x.title}</b><br>${x.text}</div></div>`).join("");
 const bad=c.some(x=>x.level==="bad"), warn=c.some(x=>x.level==="warn");
 const st=document.getElementById("status");
 st.className="status "+(bad?"bad":warn?"warn":"ok");
 st.textContent=bad?"Compatibility issue found":warn?"Build passes, but some details are unavailable":"Build passes basic checks";
}

function checks(){
 const out=[]; const m=build.motherboard,r=build.ram,g=build.graphics_card,c=build.case,cool=build.cooling,psu=build.power_supply;
 if(m&&r){
   const mt=(m.Compatibility?.memory_type||"").toUpperCase(), rt=(r.Compatibility?.memory_type||"").toUpperCase();
   const inferred=(r.Compatibility?.speed||"").toUpperCase().includes("DDR5")?"DDR5":(r.Compatibility?.speed||"").toUpperCase().includes("DDR4")?"DDR4":"";
   const ramType=rt||inferred;
   if(mt&&ramType) out.push({title:"Motherboard ↔ RAM",level:mt===ramType?"ok":"bad",text:mt===ramType?`Motherboard uses ${mt} and RAM is ${ramType}.`:`Motherboard uses ${mt}, but RAM is ${ramType}.`});
   else out.push({title:"Motherboard ↔ RAM",level:"warn",text:"Memory type information is unavailable."});
 }
 if(m&&c){
   const mf=(m.Compatibility?.form_factor||"").toLowerCase(), cf=(c.Compatibility?.form_factor||"").toLowerCase();
   if(mf&&cf) out.push({title:"Motherboard ↔ Case",level:(cf.includes(mf)||mf.includes(cf))?"ok":"bad",text:`Motherboard: ${mf}; case support: ${cf}.`});
   else out.push({title:"Motherboard ↔ Case",level:"warn",text:"Case or motherboard form-factor details are unavailable."});
 }
 if(g&&psu){
   const watts=Number(psu.Compatibility?.wattage), rec=Number(g.Compatibility?.recommended_psu_wattage);
   if(watts&&rec) out.push({title:"Graphics Card ↔ Power Supply",level:watts>=rec?"ok":"bad",text:`PSU provides ${watts}W; GPU recommends ${rec}W.`});
   else out.push({title:"Graphics Card ↔ Power Supply",level:"warn",text:"PSU wattage or GPU recommendation is unavailable."});
 }
 if(m&&cool){
   const sockets=(cool.Compatibility?.supported_sockets||cool.Compatibility?.socket_support||[]);
   const ms=m.Compatibility?.socket;
   if(ms&&sockets.length) out.push({title:"Motherboard ↔ Cooling",level:sockets.includes(ms)?"ok":"bad",text:sockets.includes(ms)?`Cooler supports ${ms}.`:`Cooler does not list support for ${ms}.`});
   else out.push({title:"Motherboard ↔ Cooling",level:"warn",text:"CPU socket support information is unavailable."});
 }
 if(g&&c){
   const gl=Number(g.Compatibility?.length_mm), cc=Number(c.Compatibility?.gpu_clearance_mm);
   if(gl&&cc) out.push({title:"Graphics Card ↔ Case",level:gl<=cc?"ok":"bad",text:gl<=cc?`GPU is ${gl}mm; case clearance is ${cc}mm.`:`GPU is ${gl}mm but case clearance is ${cc}mm.`});
   else out.push({title:"Graphics Card ↔ Case",level:"warn",text:"GPU length or case clearance is unavailable."});
 }
 if(build.fan&&c){
   const fs=Number(build.fan.Compatibility?.size_mm), cs=c.Compatibility?.fan_support;
   if(fs&&cs) out.push({title:"Fan ↔ Case",level:"ok",text:`Fan size: ${fs}mm; case fan support is available.`});
   else out.push({title:"Fan ↔ Case",level:"warn",text:"Fan/case size information could not be verified."});
 }
 return out;
}

function openModal(t){
 currentType=t; brand="All"; document.getElementById("modal").classList.add("open"); document.getElementById("search").value="";
 const brands=["All",...new Set(productsBy(t).map(p=>p.Brand).filter(Boolean))];
 document.getElementById("filters").innerHTML=brands.map(b=>`<button class="chip ${b===brand?"active":""}" onclick="setBrand('${String(b).replaceAll("'","&#39;")}')">${b}</button>`).join("");
 renderList();
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function setBrand(b){brand=b;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent===b));renderList()}
function renderList(){
 const q=document.getElementById("search").value.toLowerCase();
 let arr=productsBy(currentType).filter(p=>(brand==="All"||p.Brand===brand)&&(p["Product Name"]||"").toLowerCase().includes(q));
 document.getElementById("list").innerHTML=arr.map((p,i)=>`<div class="choice" onclick="selectProduct('${p["Product ID"]}')"><img src="${image(p)}" onerror="this.style.display='none'"><div><div class="pname">${p["Product Name"]}</div><div class="meta">${p.Brand||""} · ${p.Category||""}</div><div class="price">PKR ${money(safePrice(p))}</div></div><div class="product-actions"><strong>PKR ${money(safePrice(p))}</strong>${p["Product URL"]?`<a class="btn" href="${p["Product URL"]}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">View Product</a>`:""}</div></div>`).join("")||`<div class="empty">No products found.</div>`;
}
function selectProduct(id){const p=PRODUCTS.find(x=>String(x["Product ID"])===String(id));if(p){build[currentType]=p;closeModal();render()}}
document.getElementById("search").addEventListener("input",renderList);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
loadProducts();
</script>
</body>
</html>
